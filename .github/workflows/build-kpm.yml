name: Build SELinux_hide_From_LunSU.kpm

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show submodule pin (sanity)
        run: |
          echo "=== repo root ==="; ls -la
          echo "=== .gitmodules ==="; cat .gitmodules
          echo "=== KernelPatch HEAD ==="
          git -C KernelPatch log --oneline -1

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build KPM
        run: |
          export TARGET_COMPILE=aarch64-linux-gnu-
          export KP_DIR=$GITHUB_WORKSPACE/KernelPatch
          cd SELinux_hide_From_LunSU
          make clean
          make 2>&1 | tee build.log
          # 防呆：旧 KP 头会让 KPM_EVENT 静默退化成函数声明（模块能加载但永不工作）
          if grep -q "KPM_EVENT" build.log && grep -q "implicit-int\|no type or storage class" build.log; then
            echo "::error::KPM_EVENT not expanded - KernelPatch submodule is too old (need >= d4c88d6)"
            exit 1
          fi

      - name: Verify .kpm.event section is present
        run: |
          aarch64-linux-gnu-readelf -S SELinux_hide_From_LunSU/SELinux_hide_From_LunSU.kpm | grep -E "kpm\.(event|init)" \
            || { echo "::error::.kpm.event section missing - event callback will never fire"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SELinux_hide_From_LunSU-kpm
          path: SELinux_hide_From_LunSU/SELinux_hide_From_LunSU.kpm
          if-no-files-found: error
